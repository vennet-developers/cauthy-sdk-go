name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod says 1.24, the oldest supported; 1.26 and 1.27 are current.
        go: ['1.24', '1.26', '1.27']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: gofmt
        if: matrix.go == '1.27'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: staticcheck
        if: matrix.go == '1.27'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race -count=1 ./...
      - name: the core module has no dependency
        run: test ! -f go.sum && ! grep -q '^require' go.mod

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: cauthy-sdk-spec, pinned by tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: vennet-developers/cauthy-sdk-spec
          ref: conformance/v0.1.1
          path: spec
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the vendored vectors and route table are the pinned spec's
        run: SPEC_DIR=spec sh scripts/check-spec.sh
      - name: token vectors, every one must agree
        run: go test -count=1 -run TestVectors -v .

  postgres:
    # The Postgres key store on a real Postgres: internal/pgtest is its own
    # module, so the driver never reaches the core module.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cauthy
          POSTGRES_PASSWORD: cauthy-ci-only
          POSTGRES_DB: cauthy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cauthy -d cauthy_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: internal/pgtest/go.mod
          cache: false
      - name: key stores on Postgres 16
        working-directory: internal/pgtest
        env:
          CAUTHY_TEST_POSTGRES_DSN: postgres://cauthy:cauthy-ci-only@localhost:5432/cauthy_test?sslmode=disable
        run: |
          go vet ./...
          go test -race -count=1 -v ./... | tee pgtest.log
          ! grep -q -- '--- SKIP' pgtest.log
