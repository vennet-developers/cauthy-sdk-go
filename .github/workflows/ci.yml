name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., ./examples/acme-crm, ./gin, ./echo, ./fiber]
        # The core says go 1.24, the oldest supported. The adapters need more
        # (Echo v5 and Fiber's fixed dependencies 1.25, Gin's fixed
        # golang.org/x/net 1.26), so they skip 1.24.
        go: ['1.24', '1.26', '1.27']
        exclude:
          - module: ./gin
            go: '1.24'
          - module: ./echo
            go: '1.24'
          - module: ./fiber
            go: '1.24'
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: gofmt
        if: matrix.go == '1.27'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: staticcheck
        # staticcheck v0.8.2 needs Go 1.26 or later.
        if: matrix.go == '1.27'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: no known advisory in any module it requires
        if: matrix.go == '1.27'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -scan module
      - run: go test -race -count=1 ./...
      - name: the core module has no dependency
        if: matrix.module == '.'
        run: test ! -f go.sum && ! grep -q '^require' go.mod

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: cauthy-sdk-spec, pinned by commit (workspace persistent sessions; untagged)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: vennet-developers/cauthy-sdk-spec
          ref: d501e344e8d4ad1840c601d092b83bdf3deedb1c # conformance/v0.6.0
          path: spec
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          cache: false
      - name: the vendored vectors and route table are the pinned spec's
        run: SPEC_DIR=spec sh scripts/check-spec.sh
      - name: the CAUTHY_KEY reference is the pinned spec's, byte for byte
        run: make key-reference SPEC_DIR=spec
      - name: token vectors and the route table, every one must agree
        run: go test -count=1 -run 'TestVectors|TestEveryRouteOfTheTableIsServed' -v .
      - name: auth-bff conformance, level switches
        run: sh scripts/conformance.sh
        env:
          SPEC_DIR: ${{ github.workspace }}/spec
          LEVEL: switches
          REPORT: ${{ runner.temp }}/conformance-switches.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conformance-switches
          path: ${{ runner.temp }}/conformance-switches.json
