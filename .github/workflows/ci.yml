name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., ./examples/acme-crm, ./gin, ./echo, ./fiber]
        # The core says go 1.24, the oldest supported. Echo v5 needs 1.25 and
        # Gin 1.26 (its fixed golang.org/x/net does), so both skip 1.24.
        go: ['1.24', '1.26', '1.27']
        exclude:
          - module: ./gin
            go: '1.24'
          - module: ./echo
            go: '1.24'
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: gofmt
        if: matrix.go == '1.27'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: staticcheck
        # staticcheck v0.8.2 needs Go 1.26 or later.
        if: matrix.go == '1.27'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race -count=1 ./...
      - name: the core module has no dependency
        if: matrix.module == '.'
        run: test ! -f go.sum && ! grep -q '^require' go.mod

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: cauthy-sdk-spec, pinned by tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: vennet-developers/cauthy-sdk-spec
          ref: conformance/v0.1.1
          path: spec
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
          cache: false
      - name: the vendored vectors and route table are the pinned spec's
        run: SPEC_DIR=spec sh scripts/check-spec.sh
      - name: token vectors and the route table, every one must agree
        run: go test -count=1 -run 'TestVectors|TestEveryRouteOfTheTableIsServed' -v .
      - name: auth-bff conformance, level strict
        run: sh scripts/conformance.sh
        env:
          SPEC_DIR: ${{ github.workspace }}/spec
          LEVEL: strict
          REPORT: ${{ runner.temp }}/conformance-strict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conformance-strict
          path: ${{ runner.temp }}/conformance-strict.json

  postgres:
    # The Postgres key store on a real Postgres: internal/pgtest is its own
    # module, so the driver never reaches the core module.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cauthy
          POSTGRES_PASSWORD: cauthy-ci-only
          POSTGRES_DB: cauthy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cauthy -d cauthy_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: internal/pgtest/go.mod
          cache: false
      - name: key stores on Postgres 16
        working-directory: internal/pgtest
        env:
          CAUTHY_TEST_POSTGRES_DSN: postgres://cauthy:cauthy-ci-only@localhost:5432/cauthy_test?sslmode=disable
        run: |
          go vet ./...
          go test -race -count=1 -v ./... | tee pgtest.log
          ! grep -q -- '--- SKIP' pgtest.log
