name: release
# Go modules are published by their tags: the module proxy serves a version
# once the tag is pushed. This workflow refuses a tag whose commit does not
# pass everything CI runs, so a broken tag is seen before anyone imports it.
on:
  push:
    tags: ['v*', 'gin/v*', 'echo/v*', 'fiber/v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: vennet-developers/cauthy-sdk-spec
          ref: a9e45d986efc006b522d3f1aa8ca0f5e644b7964 # conformance/v0.4.0
          path: spec
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # staticcheck v0.8.2 and the Gin module need Go 1.26 or later.
          go-version: '1.27'
          cache: false
      - name: an adapter's tag requires a released core, without replace
        if: ${{ !startsWith(github.ref_name, 'v') }}
        run: |
          dir=${GITHUB_REF_NAME%%/*}
          ! grep -q '^replace' "$dir/go.mod"
          (cd "$dir" && GOWORK=off go test -race -count=1 ./...)
      - run: make fmt vet lint vulncheck test
      - run: SPEC_DIR=spec sh scripts/check-spec.sh
      - run: go test -count=1 -run 'TestVectors|TestEveryRouteOfTheTableIsServed' .
      - name: no version is tagged without conformance at level switches
        run: sh scripts/conformance.sh
        env:
          SPEC_DIR: ${{ github.workspace }}/spec
          LEVEL: switches
